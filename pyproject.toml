[project]
name = "shipping-bill-agent"
version = "0.1.0"
description = "航运智能账单助手智能体 —— 多格式文档解析 + OCR + LLM 提取 + 账单匹配"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-deepseek>=0.1",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "requests>=2.32",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "xlrd==1.2.0",
    "python-docx>=1.1",
    "minio>=7.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "oss2>=2.18",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bill_agent"]

[tool.uv]
# 项目路径含中文时，editable 安装会生成含中文路径的 .pth，Windows GBK 读取报错。
# 本应用按 application 运行（package=false，不自安装），直接 `python -m bill_agent.main`。
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
